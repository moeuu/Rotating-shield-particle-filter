[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rotating-shield-particle-filter"
version = "0.1.0"
description = "Continuous-surface exact-RJ particle-filter estimator for shared rotating-shield observations"
readme = "README.md"
authors = [{ name = "Eiji Morita" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "radiation-estimator-service-contracts==0.1.0",
    "rotating-shield-simulation-runtime",
    "scipy>=1.16.3",
    "torch",
]

[project.scripts]
rotating-shield-pf = "pf.replay:main"
rotating-shield-pf-live = "pf.closed_loop:main"
rotating-shield-pf-service = "pf.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
rotating-shield-simulation-runtime = { path = "../Rotating-shield-simulation-runtime", editable = true }
radiation-estimator-service-contracts = { git = "https://github.com/moeuu/radiation-estimator-service-contracts.git", rev = "e7184a117d5018ddef015182f357eb638b6fa377" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
