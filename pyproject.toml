[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "rotating-shield-particle-filter"
version = "0.1.0"
description = "Continuous-surface exact-RJ particle-filter estimator for shared rotating-shield observations"
readme = "README.md"
authors = [{ name = "Eiji Morita" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "rotating-shield-simulation-runtime",
    "scipy>=1.16.3",
    "torch",
]

[project.scripts]
rotating-shield-pf-live = "pf.closed_loop:main"

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.py[cod]", "**/*.egg-info/**"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/baselines",
    "src/evaluation",
    "src/pf",
    "src/planning",
    "src/visualization",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "configs",
    "scripts",
    "tests",
    "docs",
    "AGENTS.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "uv.lock",
    ".gitignore",
    ".python-version",
]

[tool.uv.sources]
rotating-shield-simulation-runtime = { path = "../Rotating-shield-simulation-runtime", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
